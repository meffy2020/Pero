spring.application.name=pero-backend
server.port=8080
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
pero.search.embedding.provider=auto
pero.search.embedding.openai.api-key=${OPENAI_API_KEY:}
pero.search.embedding.openai.base-url=https://api.openai.com
pero.search.embedding.openai.model=text-embedding-3-small
pero.search.embedding.openai.dimensions=256
pero.search.embedding.cache-file=build/embedding-cache/openai-embeddings.jsonl
