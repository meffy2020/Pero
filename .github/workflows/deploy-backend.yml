name: Deploy Backend to OCI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "deploy/oracle/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build backend jar
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test bootJar

      - name: Prepare deployment artifact
        run: |
          JAR_PATH="$(ls backend/build/libs/*.jar | head -n 1)"
          cp "$JAR_PATH" /tmp/pero-backend.jar

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        run: |
          scp -i ~/.ssh/oci_key /tmp/pero-backend.jar \
            deploy/oracle/deploy-backend.sh \
            deploy/oracle/pero-backend.service.template \
            deploy/oracle/pero-backend.env.example \
            "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/tmp/"

      - name: Run remote deployment
        run: |
          ssh -i ~/.ssh/oci_key "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" "\
            chmod +x /tmp/deploy-backend.sh && \
            APP_USER='${{ secrets.OCI_USER }}' \
            APP_GROUP='${{ secrets.OCI_USER }}' \
            APP_DIR='/opt/pero/backend' \
            ENV_FILE_DEST='/etc/pero/pero-backend.env' \
            SERVICE_NAME='pero-backend' \
            APP_HEALTHCHECK_URL='http://127.0.0.1:8080/api/health' \
            /tmp/deploy-backend.sh\
          "
